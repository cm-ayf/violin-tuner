name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASM_PACK_VERSION: 0.13.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: wasm-pack-${{ env.WASM_PACK_VERSION }}
          cache-bin: true
      - name: Install wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build PWA
        run: vp run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
