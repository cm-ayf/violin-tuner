name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Lint workflows and dependency configuration
        uses: jdx/jactionlint@v2.5.0
        with:
          strict-exit: true
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check formatting, lint, and types
        run: vp run check
      - name: Run tests
        run: vp run test
      - name: Build PWA
        run: vp run build
